# cargo-audit configuration for caro
#
# This file configures security audit policies for dependencies

[advisories]
# Vulnerabilities to ignore (with justification)
ignore = [
    # rsa 0.9.10 - Marvin Attack timing sidechannel (medium severity)
    # - No fix available in dependency chain (comes from LanceDB → opendal → reqsign → rsa)
    # - Waiting for upstream fix: https://github.com/RustCrypto/RSA/issues/19
    # - Impact: Potential key recovery through timing sidechannels
    # - Mitigation: Not directly exposed in Caro's API surface
    "RUSTSEC-2023-0071",

    # time <0.3.47 - RUSTSEC-2026-0009 (vulnerability in time crate)
    # - Fix requires time >=0.3.47, but time 0.3.47 depends on time-core 0.1.8
    # - time-core 0.1.8 requires Rust edition 2024, incompatible with MSRV 1.83
    # - We pin time-core=0.1.7 to maintain MSRV; time security fix deferred until
    #   time-core publishes an edition-2021-compatible 0.1.8 or MSRV is raised
    "RUSTSEC-2026-0009",

    # rustls-webpki 0.101.7 - RUSTSEC-2026-0098 / 0099 / 0104
    # - 3 vulnerabilities surface on the LEGACY rustls 0.21.x path:
    #     reqwest 0.11.27 → rustls 0.21.12 → rustls-webpki 0.101.7
    # - rustls 0.21.12 is terminal (last release on the 0.21 line); no patch
    #   upgrade exists. Fix versions (>=0.103.12) are SemVer-incompatible
    #   with the 0.101 line.
    # - The MODERN path (rustls 0.23 → rustls-webpki 0.103.13) is patched
    #   via cargo update -p rustls-webpki@0.103.10.
    # - Legacy path full fix tracked in the reqwest 0.11 → 0.12 migration
    #   epic (separate beads issue).
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",

    # quick-xml - RUSTSEC-2026-0194 / RUSTSEC-2026-0195 (high severity, DoS-class)
    # - Quadratic run time checking duplicate attribute names + unbounded
    #   namespace-declaration allocation.
    # - Two locked instances, both transitive via the LanceDB knowledge
    #   feature, both pinned by intermediate deps with no compatible
    #   quick-xml >=0.41 release yet:
    #     quick-xml 0.37.5 <- reqsign 0.16.5 (requires quick-xml ^0.37) <-
    #       opendal 0.55.0 <- lance-io 1.0.1 <- lancedb 0.23.1
    #     quick-xml 0.38.4 <- object_store 0.12.4 (requires quick-xml ^0.38.0)
    #       <- lancedb 0.23.1
    # - `cargo update -p quick-xml --precise 0.41.0` fails for both today.
    # - Revert: when reqsign and object_store both depend on quick-xml
    #   >=0.41, or lancedb bumps past both.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
