# cargo audit configuration for caro
# Generated during security triage — 2026-05-11
# Issue: https://github.com/wildcard/caro/issues/1050
#
# This is the ONLY audit.toml cargo-audit reads (cargo-audit 0.22.0 looks for
# config at `.cargo/audit.toml`, not a repo-root `audit.toml`). Confirmed
# 2026-07-12 by temporarily removing the root copy and re-running `cargo
# audit` — the allowed-warning count was unchanged.
#
# This file suppresses cargo audit warnings for dependencies where:
# (a) no fix is available from the crate author or upstream,
# (b) the advisory is unmaintained-only with no demonstrated exploit, or
# (c) the affected code path is not reachable in caro's runtime context.
#
# Revert criteria for each entry are documented inline.
# Rule: remove an entry when the parent crate updates to drop the advisory,
# or when a true vulnerability (CVE) is assigned to the crate.

[advisories]
ignore = [
    # -------------------------------------------------------------------------
    # DIRECT DEPENDENCIES — migration tracked separately
    # -------------------------------------------------------------------------

    # RUSTSEC-2025-0141: bincode 1.3.3 is unmaintained.
    # In Cargo.toml as direct dep (CVE rule serialization in src/dogma/).
    # Migration to bincode2/bitcode is a separate PR (requires format compat check).
    # Revert: When Cargo.toml is updated to a maintained bincode successor.
    # Tracked: https://github.com/wildcard/caro/issues/1050
    "RUSTSEC-2025-0141",

    # RUSTSEC-2025-0119: number_prefix 0.4.0 is unmaintained.
    # Transitive via indicatif 0.17 (direct dep in Cargo.toml).
    # indicatif upstream has not yet released a version dropping number_prefix.
    # Revert: When indicatif releases a version without number_prefix.
    # Tracked: https://github.com/wildcard/caro/issues/1050
    "RUSTSEC-2025-0119",

    # -------------------------------------------------------------------------
    # TRANSITIVE — reqwest 0.11 chain (reqwest 0.12 upgrade resolves)
    # -------------------------------------------------------------------------

    # RUSTSEC-2025-0134: rustls-pemfile is unmaintained (1.0.4 and 2.2.0).
    # 1.0.4 via reqwest 0.11.27 chain; 2.2.0 via reqwest 0.12 / hf-hub.
    # reqwest 0.12 upgrade is a separate PR (API changes required).
    # Revert: When reqwest 0.11 dep is removed and hf-hub updates.
    # Tracked: https://github.com/wildcard/caro/issues/1050
    "RUSTSEC-2025-0134",

    # RUSTSEC-2026-0098: rustls-webpki — CRL distribution-point matching flaw.
    # RUSTSEC-2026-0099: rustls-webpki — wildcard name constraint accepted incorrectly.
    # RUSTSEC-2026-0104: rustls-webpki — reachable panic in CRL parsing.
    # All three affect the LEGACY path: reqwest 0.11.27 → rustls 0.21.12 →
    # rustls-webpki 0.101.7. The rustls 0.21.x line is terminal (no patch
    # releases planned). The patched versions (>= 0.103.12 / >= 0.103.13)
    # are SemVer-incompatible with the 0.101.x series — cargo-audit therefore
    # does not flag these as vulnerabilities for 0.101.7. Entries here are
    # precautionary: if a future advisory version or audit tool change causes
    # the 0.101.7 path to be flagged, these suppressions ensure CI stays green.
    # MODERN path (rustls 0.23 → rustls-webpki 0.103.13) is already patched
    # via `cargo update -p rustls-webpki@0.103.10`.
    # Long-term fix: reqwest 0.11 → 0.12 migration (tracked separately).
    # Revert: When reqwest 0.11 is removed from Cargo.toml.
    # Tracked: https://github.com/wildcard/caro/issues/1050, PR #1026
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",

    # RUSTSEC-2026-0346: rustls — `Debug` impls for client session values expose TLS secrets.
    # RUSTSEC-2026-0349: rustls — unauthenticated ServerHello can downgrade later
    #                    connections to classical key exchange.
    # Fixed only in rustls >= 0.23.46; the 0.23 path is patched in Cargo.lock
    # (#1669). These entries cover the LEGACY rustls 0.21.12 path, which has no
    # fixed 0.21 release and exists only behind optional, non-default features:
    #   - `knowledge`: lancedb 0.23 -> lance -> aws-sdk-dynamodb (default
    #     feature "rustls") -> aws-smithy-http-client "legacy-rustls-ring"
    #     -> hyper-rustls 0.24 / tokio-rustls 0.24 -> rustls 0.21.12
    #   - `chromadb`: chromadb 2.3.0 (latest) -> minreq "https-rustls" -> rustls 0.21.12
    # The default build (`cargo install caro`) does not link rustls 0.21.
    # Caveat: the IDs also match rustls 0.23.45; keep Cargo.lock on >= 0.23.46.
    # Revert: when lancedb/lance and chromadb drop rustls 0.21 (lancedb 0.40+
    # needs an arrow bump), or when the knowledge/chromadb features are removed.
    # Review by: 2026-12-31.
    # Tracked: https://github.com/wildcard/caro/issues/1668
    "RUSTSEC-2026-0346",
    "RUSTSEC-2026-0349",

    # RUSTSEC-2026-0381: webpki-roots — bundled roots trust distrusted emSign intermediates.
    # RUSTSEC-2026-0382: rustls-webpki — certificate verification may accept
    #                    distrusted intermediates.
    # Fixed in webpki-roots >= 1.0.10 and rustls-webpki >= 0.103.16; those paths
    # are patched in Cargo.lock (#1700). These entries cover only the same LEGACY
    # rustls 0.21 path as RUSTSEC-2026-0346/0349 above, behind optional features:
    #   - `chromadb`: chromadb 2.3.0 -> minreq -> webpki-roots 0.25.4 and
    #     rustls-webpki 0.101.7
    #   - `knowledge`: lancedb 0.23 -> ... -> rustls 0.21.12 -> rustls-webpki 0.101.7
    # The default build (`cargo install caro`) does not link either version.
    # Caveat: RUSTSEC-2026-0382 also matches rustls-webpki 0.103.x below 0.103.16
    # and RUSTSEC-2026-0381 matches webpki-roots 1.0.x below 1.0.10; keep
    # Cargo.lock on the fixed versions.
    # Revert: when chromadb and lancedb drop rustls 0.21 (same condition as above),
    # or when the knowledge/chromadb features are removed.
    # Review by: 2026-12-31.
    # Tracked: https://github.com/wildcard/caro/issues/1699
    "RUSTSEC-2026-0381",
    "RUSTSEC-2026-0382",

    # RUSTSEC-2026-0391: zstd — data from an abandoned stream leaks into the next stream.
    # RUSTSEC-2026-0398: zstd-safe — Seekable::decompress sets a Vec length past capacity.
    # RUSTSEC-2026-0403: zstd-safe — uninitialized memory on a failed legacy-frame decode.
    # RUSTSEC-2026-0410: zstd-sys — WebAssembly allocator shim corrupts memory.
    # Fixed in zstd >= 0.14.3 / zstd-safe >= 8.2.0 / zstd-sys >= 2.1.2. zstd-safe 8
    # needs zstd 0.14, a major bump that must come from upstream, so `cargo update`
    # cannot reach it. zstd exists only behind optional, non-default features:
    #   - `knowledge` / `chromadb`: lancedb 0.23 -> lance 1.0 -> arrow-ipc 56 and
    #     datafusion 50 -> async-compression 0.4 -> zstd 0.13.3 / zstd-safe 7.2.4
    # The default build and the release feature sets (embedded-cpu,
    # remote-backends, embedded-mlx) do not link zstd. caro does not target wasm,
    # so RUSTSEC-2026-0410 does not apply to any shipped build.
    # Revert: when lancedb/lance/arrow move to zstd 0.14, or when the
    # knowledge/chromadb features are removed.
    # Review by: 2026-12-31.
    # Tracked: https://github.com/wildcard/caro/issues/1730
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
    "RUSTSEC-2026-0410",

    # -------------------------------------------------------------------------
    # TRANSITIVE — time crate (MSRV-pinned)
    # -------------------------------------------------------------------------

    # RUSTSEC-2026-0009: time <0.3.47 vulnerability.
    # Fix requires time >=0.3.47, but time 0.3.47 depends on time-core 0.1.8.
    # time-core 0.1.8 requires Rust edition 2024, incompatible with MSRV 1.83.
    # We pin time-core=0.1.7 to maintain MSRV; time security fix deferred
    # until time-core publishes an edition-2021-compatible 0.1.8 or MSRV is
    # raised.
    # Revert: When time-core ships an MSRV-compatible 0.1.8+, or MSRV is raised.
    "RUSTSEC-2026-0009",

    # -------------------------------------------------------------------------
    # TRANSITIVE — LanceDB / fastembed / knowledge optional feature
    # -------------------------------------------------------------------------

    # RUSTSEC-2026-0105: core2 0.4.0 yanked and unmaintained.
    # Via fastembed -> image -> ravif -> rav1e -> bitstream-io.
    # No control without updating fastembed. Image codec path; not hot path.
    # Revert: When fastembed releases a version transitively dropping core2.
    # Tracked: https://github.com/wildcard/caro/issues/1050
    "RUSTSEC-2026-0105",

    # RUSTSEC-2024-0436: paste 1.0.15 is unmaintained.
    # proc-macro crate; zero runtime impact. Pulled in by tokenizers, lancedb,
    # mlx-rs, parquet — no single upstream to update.
    # Revert: When all upstream crates stop using paste.
    # Tracked: https://github.com/wildcard/caro/issues/1050
    "RUSTSEC-2024-0436",

    # RUSTSEC-2026-0002: lru 0.12.5 IterMut unsound (Stacked Borrows).
    # Theoretical unsoundness under Stacked Borrows model; no demonstrated
    # exploit in safe code. Pulled in by lancedb and lance-* subcrates.
    # Revert: When lancedb updates to an lru version with the fix.
    # Tracked: https://github.com/wildcard/caro/issues/1050
    "RUSTSEC-2026-0002",

    # RUSTSEC-2026-0367: zip — SUID/SGID bits preserved during extraction.
    # RUSTSEC-2026-0368: zip — `ZipArchive::extract` creates symlinks that point
    #                    outside the destination directory.
    # RUSTSEC-2026-0369: zip — `extract()` applies Unix permissions through symlinks.
    # Fixed only in zip >= 9.0.0. zip 7.2.0 comes in only via candle-core 0.10.2
    # (default `embedded-cpu`); even candle-core 0.11.0 requires zip ^8.6.
    # All three advisories are in the extract APIs. candle-core only reads
    # archives in memory (`ZipArchive::new` + `by_name` in src/pickle.rs and
    # src/npy.rs, plus `ZipWriter` for .npz output) and never calls `extract`;
    # caro's own code does not use the zip crate.
    # Revert: when a candle release requires zip >= 9 and caro bumps to it.
    # Review by: 2026-12-31.
    # Tracked: https://github.com/wildcard/caro/issues/1681
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",

    # -------------------------------------------------------------------------
    # TRANSITIVE — wiremock dev-dependency only (not in release binaries)
    # -------------------------------------------------------------------------

    # RUSTSEC-2024-0384: instant 0.1.13 is unmaintained.
    # Dev-dep only: wiremock -> http-types -> futures-lite -> fastrand.
    # Not present in release binaries.
    # Revert: When wiremock updates and drops instant transitively.
    # Tracked: https://github.com/wildcard/caro/issues/1050
    "RUSTSEC-2024-0384",

    # RUSTSEC-2026-0097: rand (all versions) unsound with custom global logger.
    # Requires a custom Rust global logger that itself calls rand during
    # initialization — not applicable to caro. Affects rand 0.7.3 (wiremock
    # dev chain), 0.8.5 (fastembed/lancedb), 0.9.2 (ring/crypto paths).
    # Revert: When rand releases a fixed version and upstreams update.
    # Tracked: https://github.com/wildcard/caro/issues/1050
    "RUSTSEC-2026-0097",

    # -------------------------------------------------------------------------
    # ALREADY IN deny.toml — mirrored here for cargo audit compatibility
    # -------------------------------------------------------------------------

    # RUSTSEC-2023-0071: rsa Marvin Attack — no fix available from RustCrypto.
    # Via reqsign -> opendal -> lance-io (LanceDB knowledge feature).
    # Risk accepted as upstream dependency with no available fix.
    # Also in deny.toml [advisories] ignore list.
    "RUSTSEC-2023-0071",

    # -------------------------------------------------------------------------
    # TRANSITIVE — h2 0.3 via optional knowledge / chromadb features only
    # -------------------------------------------------------------------------

    # RUSTSEC-2026-0258: h2 unbounded empty DATA frames (DoS). Fixed only in
    # h2 >= 0.4.16; the 0.3.x line has no patched release.
    # Approved by maintainer 2026-10-01 (BW-001, #1488).
    # The default and remote-backends builds no longer contain h2 0.3 since
    # the reqwest 0.12 upgrade (#1488), and h2 0.4 is at 0.4.19 (patched).
    # h2 0.3.27 remains in Cargo.lock ONLY via optional features:
    #   - `chromadb`: chromadb 2.3.0 (latest) -> reqwest 0.11 -> hyper 0.14
    #   - `knowledge`: lancedb 0.23 -> lance-io -> aws-config ->
    #     aws-smithy-http-client 1.1 (pinned by lance-io)
    # Check: `cargo tree -i h2@0.3.27` (default features) must print no match.
    # Review by 2026-12-31. Revert: when lancedb is upgraded (0.39+) and the
    # chromadb crate is replaced or drops reqwest 0.11.
    # Tracked: https://github.com/wildcard/caro/issues/1472 (BW-001)
    "RUSTSEC-2026-0258",

    # -------------------------------------------------------------------------
    # TRANSITIVE — quick-xml via LanceDB stack (fix is semver-major upstream)
    # -------------------------------------------------------------------------

    # RUSTSEC-2026-0194 / RUSTSEC-2026-0195: quick-xml 0.37.5 / 0.38.4 —
    # quadratic duplicate-attribute check and unbounded namespace-declaration
    # allocation (both DoS-class). Fix requires quick-xml >= 0.41.0, which is
    # SemVer-incompatible with both pinned lines. Transitive via the LanceDB
    # knowledge stack only (0.37.5: lance-io -> opendal -> reqsign; 0.38.4:
    # datafusion -> object_store). These paths parse object-store/S3 API XML
    # responses, not untrusted user input; worst case is a DoS of the optional
    # knowledge feature, not the core CLI.
    # Revert: when lancedb/opendal/object_store release against quick-xml 0.41+.
    # Tracked: https://github.com/wildcard/caro/issues/1050
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
