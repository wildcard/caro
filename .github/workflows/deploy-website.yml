name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22  # Astro 6 needs Node >= 22.12
          cache: 'npm'
          cache-dependency-path: './website/package-lock.json'

      - name: Install dependencies
        working-directory: ./website
        run: npm ci

      # `npm run build` is `astro build --remote`, which needs Astro Studio
      # credentials. Vercel (caro.sh) has them; this runner does not. A local
      # database file builds the same pages, except that the waitlist count
      # comes from the seed, not the live database. This static copy has no
      # /api routes, so the waitlist form only works on caro.sh.
      - name: Build Astro site
        working-directory: ./website
        env:
          ASTRO_DATABASE_FILE: ${{ runner.temp }}/caro.db
        run: |
          npm run prebuild
          npx astro build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./website/dist/client  # the Vercel adapter writes static pages here

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
