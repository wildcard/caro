name: Favicons

# Guards the favicon on every site (caro.sh, docs, changelog, landing, slides,
# devrel, Storybook). The files are generated by scripts/favicons.py from the
# official pixel mark; `--check` fails if a site's copy is missing, differs
# from the others, embeds an external reference (browsers will not load it),
# uses the forbidden orange, or is no longer linked from the site's <head>.
# Standard library only: no install step.

on:
  pull_request:
    paths:
      - 'website/**'
      - 'docs-site/**'
      - 'changelog/**'
      - 'landing/**'
      - 'presentation/**'
      - 'apps/devrel/**'
      - 'scripts/favicons.py'
      - '.github/workflows/favicons.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs-site/**'
      - 'changelog/**'
      - 'landing/**'
      - 'presentation/**'
      - 'apps/devrel/**'
      - 'scripts/favicons.py'
      - '.github/workflows/favicons.yml'

jobs:
  check:
    name: Favicon contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check favicons
        run: python3 scripts/favicons.py --check
