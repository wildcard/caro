name: Favicons

# Guards the favicon on every site (caro.sh, docs, changelog, landing, slides,
# devrel, Storybook). The files are generated by scripts/favicons.py from the
# official pixel mark; `--check` fails if the mark or any copy no longer matches
# scripts/favicons.sha256, if the SVG embeds an external reference (browsers
# will not load it) or the forbidden orange, or if a site stops linking it.
# Standard library only: no install step.

on:
  pull_request:
    paths:
      - 'website/**'
      - 'docs-site/**'
      - 'changelog/**'
      - 'landing/**'
      - 'presentation/**'
      - 'apps/devrel/**'
      - 'scripts/favicons.py'
      - 'scripts/favicons.sha256'
      - '.github/workflows/favicons.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs-site/**'
      - 'changelog/**'
      - 'landing/**'
      - 'presentation/**'
      - 'apps/devrel/**'
      - 'scripts/favicons.py'
      - 'scripts/favicons.sha256'
      - '.github/workflows/favicons.yml'

permissions:
  contents: read

jobs:
  check:
    name: Favicon contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check favicons
        run: python3 scripts/favicons.py --check
