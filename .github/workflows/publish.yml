name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'
  # For tags created by the Tag Release workflow: GITHUB_TOKEN-pushed tags
  # do not fire the push trigger (recursion prevention). Dispatch from MAIN
  # (which contains this trigger — older tag refs do not, see gh docs on
  # --ref) with the tag as an input; the tag ref is checked out explicitly.
  #   gh workflow run publish.yml --ref main -f tag=vX.Y.Z
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (e.g. v1.5.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: stable

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # On tag push inputs.tag is empty and github.ref is the tag;
          # on dispatch we check out the input tag explicitly.
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: publish
          install-protobuf: "true"

      - name: Verify version consistency
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_VERSION=${INPUT_TAG#v}
          else
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
          fi
          CARGO_VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          echo "Tag version: $TAG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) doesn't match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "Version check passed: $TAG_VERSION"

      - name: Install cmake (additional system dep)
        run: sudo apt-get install -y cmake

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run comprehensive tests
        run: |
          # Run unit and integration tests, excluding LLM evaluation harness
          # The evaluation harness requires a real model and is run separately
          cargo test --lib --all-features --verbose
          cargo test --bins --all-features --verbose
        env:
          RUST_BACKTRACE: 1

      - name: Verify MLX tests compile (Ubuntu)
        run: |
          echo "Verifying MLX backend compiles on all platforms"
          cargo test --test mlx_backend_contract --no-run --verbose
          cargo test --test mlx_integration_test --no-run --verbose
        env:
          RUST_BACKTRACE: 1

      # Note: E2E tests that require LLM model are skipped in CI
      # They are run locally and in dedicated evaluation workflows

      - name: Run integration tests (non-LLM)
        run: |
          cargo test --test error_handling_tests --verbose
          cargo test --test infrastructure_integration --verbose
        env:
          RUST_BACKTRACE: 1

      - name: Run contract tests
        run: |
          cargo test --test backend_trait_contract --verbose
          cargo test --test safety_validator_contract --verbose
          cargo test --test platform_detection_contract --verbose
          cargo test --test config_contract --verbose
          cargo test --test execution_contract --verbose
        env:
          RUST_BACKTRACE: 1

      - name: Build release binary to verify
        run: cargo build --release

      - name: Verify package can be created
        run: cargo package --allow-dirty

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          echo "Publishing version ${{ steps.version.outputs.version }} to crates.io..."
          cargo publish --allow-dirty
          echo "Successfully published to crates.io"
