name: Release

# Triggered after successful publish to crates.io
# Note: workflow_run depends on exact workflow name matching
on:
  workflow_run:
    workflows: ["Publish to crates.io"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g., v1.0.2)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: stable

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    outputs:
      tag: ${{ steps.get_tag.outputs.tag }}
      version: ${{ steps.get_tag.outputs.version }}
    steps:
      - name: Checkout at trigger commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Get tag from commit or input
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger - use provided tag
            TAG="${{ inputs.tag }}"
            VERSION="${TAG#v}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Manual trigger with tag: $TAG (version: $VERSION)"
          else
            # Workflow run trigger - get tag from commit
            TAG=$(git tag --points-at ${{ github.event.workflow_run.head_sha }} | grep '^v' | head -1)
            if [ -z "$TAG" ]; then
              echo "::error::No version tag found for commit ${{ github.event.workflow_run.head_sha }}"
              exit 1
            fi
            VERSION="${TAG#v}"
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Found tag: $TAG (version: $VERSION)"
          fi

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: release-prepare

      - name: Verify version consistency
        run: |
          CARGO_VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          if [ "${{ steps.get_tag.outputs.version }}" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version (${{ steps.get_tag.outputs.version }}) doesn't match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version check passed: $CARGO_VERSION"

      - name: Verify package on crates.io
        run: |
          VERSION="${{ steps.get_tag.outputs.version }}"
          echo "Checking if caro@$VERSION is available on crates.io..."

          # Poll crates.io API with proper User-Agent (required by crates.io policy)
          # Using 10 retries with 15s intervals to handle propagation delays
          for i in $(seq 1 10); do
            RESPONSE=$(curl -s -H "User-Agent: caro-release-workflow (https://github.com/wildcard/caro)" \
              "https://crates.io/api/v1/crates/caro/$VERSION")

            FOUND_VERSION=$(echo "$RESPONSE" | jq -r '.version.num // empty')
            if [ "$FOUND_VERSION" = "$VERSION" ]; then
              echo "Verified: caro@$VERSION is published on crates.io"
              exit 0
            fi

            echo "Attempt $i/10: Package not yet available, waiting 15s..."
            sleep 15
          done

          echo "::error::Could not verify caro@$VERSION on crates.io after 10 attempts"
          exit 1

  create-release:
    name: Create GitHub Release
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Check if release exists
        id: check_release
        run: |
          # Only a published release counts. `gh release view` also matches the
          # draft release-drafter keeps for the upcoming tag, which would skip
          # creation and leave the release unpublished (#1625). The tags
          # endpoint never returns drafts.
          if gh api "repos/${{ github.repository }}/releases/tags/${{ needs.prepare-release.outputs.tag }}" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release ${{ needs.prepare-release.outputs.tag }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release ${{ needs.prepare-release.outputs.tag }} does not exist"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog for template
        if: steps.check_release.outputs.exists != 'true'
        id: changelog
        run: |
          # Extract the changelog section for this version from CHANGELOG.md
          VERSION="${RELEASE_VERSION}"
          CHANGELOG_SECTION=$(awk "/^## \[${VERSION}\]/{p=1;next} p&&/^## \[/{p=0} p" CHANGELOG.md)

          if [ -n "$CHANGELOG_SECTION" ]; then
            echo "Extracted CHANGELOG section for v${VERSION}"
            CHANGELOG="$CHANGELOG_SECTION"
          else
            echo "No CHANGELOG section found for v${VERSION}, falling back to generated notes"
            CHANGELOG=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="${RELEASE_TAG}" \
              -f previous_tag_name="$(git describe --tags --abbrev=0 ${RELEASE_TAG}^ 2>/dev/null || echo '')" \
              --jq '.body')
          fi

          # Replace VERSION placeholder in template
          sed "s/VERSION/${RELEASE_VERSION}/g" .github/RELEASE_TEMPLATE.md > /tmp/template-with-version.md

          # Create release notes by combining changelog with template
          {
            echo "$CHANGELOG"
            echo ""
            echo "---"
            echo ""
            cat /tmp/template-with-version.md
          } > /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}

      - name: Create Release
        if: steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: caro v${{ needs.prepare-release.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.prepare-release.outputs.version, 'alpha') || contains(needs.prepare-release.outputs.version, 'beta') || contains(needs.prepare-release.outputs.version, 'rc') }}
          body_path: /tmp/release-notes.md
          # Ship the Kyaro artwork notice alongside the release binaries, as
          # the notice's official-release permission requires. Read from the
          # tagged checkout above.
          files: assets/kyaro/README.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-upload:
    name: Build and Upload
    needs: [prepare-release, create-release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: caro-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: caro-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: caro-macos-intel
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: caro-macos-silicon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: caro-windows-amd64.exe

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key-suffix: release-build-${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross

      - name: Run comprehensive tests per platform
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: |
          # Run lib and bin tests (excludes LLM-dependent integration tests)
          cargo test --lib --verbose
          cargo test --bins --verbose
        env:
          RUST_BACKTRACE: 1

      - name: Run contract tests per platform
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: |
          cargo test --test backend_trait_contract --verbose
          cargo test --test safety_validator_contract --verbose
          cargo test --test platform_detection_contract --verbose
          cargo test --test config_contract --verbose
          cargo test --test execution_contract --verbose
        env:
          RUST_BACKTRACE: 1

      - name: Run non-LLM integration tests per platform
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: |
          cargo test --test error_handling_tests --verbose
          cargo test --test infrastructure_integration --verbose
          cargo test --test embedded_integration --verbose
        env:
          RUST_BACKTRACE: 1

      # Note: LLM-dependent tests (E2E CLI, assess, MLX tests) are run in
      # the separate llm-tests.yml workflow and don't block releases

      - name: Build release binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash
        env:
          CARO_RELEASE: 1  # Mark as official release build for version info

      - name: Prepare release artifact
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          BASE_NAME=$(echo "${{ matrix.asset_name }}" | sed 's/^caro-//')
          VERSIONED_NAME="caro-${VERSION}-${BASE_NAME}"

          echo "Creating versioned asset: ${VERSIONED_NAME}"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/caro.exe "${VERSIONED_NAME}"
            # certUtil output format differs from shasum, normalize to: <hash>  <filename>
            HASH=$(certUtil -hashfile "${VERSIONED_NAME}" SHA256 | grep -v ":" | tr -d '[:space:]')
            echo "$HASH  ${VERSIONED_NAME}" > "${VERSIONED_NAME}.sha256"
          else
            cp target/${{ matrix.target }}/release/caro "${VERSIONED_NAME}"
            chmod +x "${VERSIONED_NAME}"
            shasum -a 256 "${VERSIONED_NAME}" > "${VERSIONED_NAME}.sha256"
          fi

          # Save versioned name for upload step
          echo "versioned_asset=${VERSIONED_NAME}" >> $GITHUB_OUTPUT
        id: prepare_asset
        shell: bash

      # Default assets first. Nothing optional below can block this upload.
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: |
            ${{ steps.prepare_asset.outputs.versioned_asset }}
            ${{ steps.prepare_asset.outputs.versioned_asset }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Opt-in richer build (#1081): the same source built with
      # `--features remote-backends`, published as a separate `-remote` asset.
      # The default asset and the crates.io package keep the minimal feature
      # set; nothing here changes `[features] default`.
      #
      # Every step below uses continue-on-error and runs after the default
      # upload, so a failing build, prepare, smoke or upload step cannot stop
      # the default assets from being uploaded. The `-remote` upload runs only
      # after the smoke test passed, and the default binary can never be
      # uploaded under the `-remote` name.
      #
      # Known limits:
      # - A cancelled run, a job timeout or a runner failure during this extra
      #   build ends the Release run without success. The default assets are
      #   already on the release, but update-homebrew.yml and packages.yml only
      #   start after a successful run, so they would not run. Every release
      #   also waits for this build before those workflows start. A separate
      #   job or workflow would remove both effects; that is an owner decision.
      # - The smoke test runs the binary, except for the cross-built
      #   linux-arm64 binary, which cannot run on the runner. That one gets a
      #   static check on two strings that differ between the builds. It
      #   proves the feature took effect, not that the binary runs. It relies
      #   on the "not compiled" message living only in code that the remote
      #   build leaves out (the `cfg(not(feature = "remote-backends"))` caller
      #   of `remote_backend_unavailable_error` in src/cli/mod.rs), and on both
      #   messages staying as they are. A local x86_64 release build confirmed
      #   this; the cross-built arm64 binary has not been checked. If either
      #   message changes, that platform quietly gets no `-remote` asset; the
      #   final step below reports it. Update the strings here when they change.
      # - None of these steps has run yet: this workflow only runs after a tag
      #   is published, so the first real run is the first evidence.
      # - The x86_64-apple-darwin binary is run on an arm64 `macos-latest`
      #   runner and needs Rosetta 2. If it cannot run, that platform simply
      #   gets no `-remote` asset.
      - name: Build remote-backends release binary
        id: build_remote
        continue-on-error: true
        timeout-minutes: 60
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --features remote-backends --target ${{ matrix.target }}
          else
            cargo build --release --features remote-backends --target ${{ matrix.target }}
          fi
        shell: bash
        env:
          CARO_RELEASE: 1

      - name: Prepare remote-backends artifact
        id: prepare_remote_asset
        if: steps.build_remote.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          BASE_NAME=$(echo "${{ matrix.asset_name }}" | sed 's/^caro-//')
          # caro-1.5.0-linux-amd64        -> caro-1.5.0-linux-amd64-remote
          # caro-1.5.0-windows-amd64.exe  -> caro-1.5.0-windows-amd64-remote.exe
          case "${BASE_NAME}" in
            *.exe) REMOTE_NAME="caro-${VERSION}-${BASE_NAME%.exe}-remote.exe" ;;
            *)     REMOTE_NAME="caro-${VERSION}-${BASE_NAME}-remote" ;;
          esac

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/caro.exe "${REMOTE_NAME}"
            HASH=$(certUtil -hashfile "${REMOTE_NAME}" SHA256 | grep -v ":" | tr -d '[:space:]')
            echo "$HASH  ${REMOTE_NAME}" > "${REMOTE_NAME}.sha256"
          else
            cp target/${{ matrix.target }}/release/caro "${REMOTE_NAME}"
            chmod +x "${REMOTE_NAME}"
            shasum -a 256 "${REMOTE_NAME}" > "${REMOTE_NAME}.sha256"
          fi
          echo "remote_asset=${REMOTE_NAME}" >> $GITHUB_OUTPUT

      # The `-remote` binary must list its backends and report none of them as
      # "not compiled". The positive `ollama` row check rejects empty or
      # truncated output.
      - name: Smoke-test remote-backends artifact
        id: smoke_remote
        if: steps.prepare_remote_asset.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        env:
          REMOTE_ASSET: ${{ steps.prepare_remote_asset.outputs.remote_asset }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "${TARGET}" = "aarch64-unknown-linux-gnu" ]; then
            # Cross-built: cannot run here. The remote build carries the
            # missing-key message; the default build carries the
            # "not compiled" message instead.
            if ! grep -aq 'ANTHROPIC_API_KEY environment variable not set' "./${REMOTE_ASSET}" \
               || grep -aq 'which is not compiled into this build' "./${REMOTE_ASSET}"; then
              echo "::error::arm64 binary does not look like a remote-backends build"
              exit 1
            fi
            exit 0
          fi
          OUT=$("./${REMOTE_ASSET}" --backend-info < /dev/null 2>&1) || {
            echo "$OUT"
            echo "::error::--backend-info exited non-zero"
            exit 1
          }
          echo "$OUT"
          if ! grep -Eq '^[[:space:]]*ollama[[:space:]]' <<<"$OUT"; then
            echo "::error::--backend-info printed no ollama row"
            exit 1
          fi
          if grep -q "not compiled" <<<"$OUT"; then
            echo "::error::remote-backends asset reports a backend as 'not compiled'"
            exit 1
          fi

      - name: Upload remote-backends assets
        id: upload_remote
        if: steps.smoke_remote.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          files: |
            ${{ steps.prepare_remote_asset.outputs.remote_asset }}
            ${{ steps.prepare_remote_asset.outputs.remote_asset }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Failures above are non-blocking by design, so make a missing `-remote`
      # asset visible: a warning annotation and a line in the job summary.
      - name: Report missing remote-backends asset
        if: always() && steps.build_remote.outcome != 'skipped' && steps.upload_remote.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUILD: ${{ steps.build_remote.outcome }}
          PREPARE: ${{ steps.prepare_remote_asset.outcome }}
          SMOKE: ${{ steps.smoke_remote.outcome }}
          UPLOAD: ${{ steps.upload_remote.outcome }}
        run: |
          MSG="no -remote asset for ${TARGET}: build=${BUILD} prepare=${PREPARE} smoke=${SMOKE} upload=${UPLOAD}"
          echo "::warning::${MSG}"
          echo "- ${MSG}" >> "$GITHUB_STEP_SUMMARY"
