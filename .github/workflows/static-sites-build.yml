name: Static Sites Build

# Cold-build guard for the static sites: docs-site and Storybook (Cloudflare
# Pages) and the main website (Vercel).
#
# Why this exists: before this workflow, no CI job built docs-site or
# Storybook. Both were only ever built by the hosting provider from a warm
# dependency resolution, which let a breaking change hide in an already-
# satisfied semver range — `@astrojs/starlight@^0.39.2` removed autogenerated
# sidebar *groups* in 0.39.0, and docs-site's config kept using one. The site
# kept deploying because nothing ever resolved the range from cold.
#
# This job reproduces the Cloudflare build exactly (cold `npm ci`, Node 22),
# so a green run here is a real predictor of a green Pages deploy.
#
# The website's vitest suite runs in website-tests.yml instead: it needs no
# pull_request path filter, so it can be a required check.

on:
  pull_request:
    paths:
      - 'docs-site/**'
      - 'website/**'
      - 'docs/**'
      - 'Cargo.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/static-sites-build.yml'
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'website/**'
      - 'docs/**'
      - 'Cargo.toml'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: static-sites-${{ github.ref }}
  cancel-in-progress: true

# Every job only builds or tests; none writes to the repo.
permissions:
  contents: read

jobs:
  docs-site:
    name: Build docs-site (Cloudflare Pages)
    # Pinned (#1701): playwright-chromium has no Chromium for ubuntu-latest
    # (Ubuntu 26.04), so npm ci fails. Revert to ubuntu-latest once it does.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Cold install from the lockfile, from the repo root: docs-site is an
      # npm workspace, so its deps resolve against the root lockfile.
      - name: Install (cold, lockfile-exact)
        run: npm ci --no-audit --no-fund

      # `prebuild` runs generate-llm-txt + sync-docs, which read ../docs/**
      # and ../Cargo.toml — the same out-of-directory inputs Cloudflare's
      # build watch paths must cover.
      - name: Build
        run: npm run build --workspace=caro-docs

      - name: Assert output
        run: test -f docs-site/dist/index.html

  # The main site deploys through Vercel's Git integration, which builds it
  # but runs no tests. This job runs the website unit tests and a cold build.
  # The build's caro:agent-seo step (website/src/integrations/agent-seo.ts)
  # fails it when any page lacks its share card, Markdown twin, canonical URL
  # or description, so a green run means every page shipped with them.
  website:
    name: Build website (caro.sh)
    # Pinned (#1701): playwright-chromium has no Chromium for ubuntu-latest
    # (Ubuntu 26.04), so npm ci fails. Revert to ubuntu-latest once it does.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (cold, lockfile-exact)
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test --workspace=caro-website

      # Vitest and `astro build` strip types without checking them. This
      # checks the build-time SEO code; the rest of the site still has older
      # type errors (see the comment in website/tsconfig.seo.json).
      - name: Type-check build-time SEO code
        working-directory: website
        run: npx tsc -p tsconfig.seo.json

      # `npm run build` adds `--remote`, which needs the production Turso
      # database. A local SQLite file builds the same pages.
      - name: Build
        working-directory: website
        env:
          ASTRO_DATABASE_FILE: ${{ runner.temp }}/caro.db
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          node scripts/extract-version.mjs
          node scripts/generate-search-index.mjs
          npx astro build

      - name: Assert agent and share files
        working-directory: website
        run: |
          for f in llms.txt llms-full.txt rss.xml index.md docs/cli.md og/index.png og/docs/cli.png; do
            test -s ".vercel/output/static/$f" || { echo "missing $f"; exit 1; }
          done
          grep -q 'text/markdown' .vercel/output/config.json

  storybook:
    name: Build Storybook (Cloudflare Pages)
    # Pinned (#1701): playwright-chromium has no Chromium for ubuntu-latest
    # (Ubuntu 26.04), so npm ci fails. Revert to ubuntu-latest once it does.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install (cold, lockfile-exact)
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build-storybook --workspace=caro-website
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'

      - name: Assert output
        run: test -f website/storybook-static/index.html
