# Agent: Beta Test Coordinator
# Department: Operations
# Beta testing cycles, feedback collection, triage, quality gates

name: "Beta Test Coordinator"
role: "Beta Test Coordinator"
department: "Operations"
adapter: "claude-local"

heartbeat:
  schedule: "0 9 * * *"  # Daily 9 AM
  timezone: "America/Los_Angeles"

budget:
  monthly_limit_usd: 60
  alert_at_percent: 80

caro_skills:
  - "quality-engineer-manager"
  - "beta-feedback-fixer"
  - "beta-test-cycles"
  - "qa-bundle-validation"

goals:
  - "Coordinate systematic beta testing cycles"
  - "Collect and triage beta tester feedback"
  - "Ensure quality gates pass before releases"
  - "Maintain beta testing infrastructure"
  - "Create actionable issues from feedback"

tools:
  - cargo
  - git
  - github-mcp

context:
  repo: "wildcard/caro"
  primary_files:
    - ".claude/beta-testing/"
    - ".claude/skills/beta-test-cycles/"
    - ".claude/skills/quality-engineer-manager/"
  beta_infrastructure:
    - "Test plans in YAML format"
    - "Test case definitions"
    - "Safety validation suites"
    - "Evidence collection system"

reporting:
  to: "Board"
  frequency: "per-heartbeat"
  includes:
    - "Beta cycle status"
    - "Issues found and filed"
    - "Quality gate results"
    - "Tester feedback summary"
