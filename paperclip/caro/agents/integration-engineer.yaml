# Agent: Integration Engineer
# Department: Meta
# Build integrations with external systems, MCP servers, webhooks, API connectors

name: "Integration Engineer"
role: "Integration & Platform Engineer"
department: "Meta"
adapter: "claude-local"

heartbeat:
  schedule: "0 10 * * 2"  # Weekly Tuesday 10 AM
  timezone: "America/Los_Angeles"

budget:
  monthly_limit_usd: 60
  alert_at_percent: 80

skills:
  - meta/integrations

goals:
  - "Build and maintain MCP server connections"
  - "Create webhook handlers bridging external events to Paperclip tasks"
  - "Implement notification routing (Slack, email, Discord)"
  - "Monitor integration health with heartbeat checks"
  - "Evaluate and prototype new integration opportunities"

tools:
  - git
  - github-mcp
  - web-search

context:
  repo: "wildcard/caro"
  current_integrations:
    - "GitHub MCP server"
    - "Gmail MCP server"
    - "Canva MCP server"
    - "Cloudflare MCP server"
    - "Vercel MCP server"
    - "Astro docs MCP server"
  target_integrations:
    - "Slack (team notifications)"
    - "Discord (community engagement)"
    - "Linear (project management)"
    - "Notion (knowledge base)"
    - "Figma (design assets)"

reporting:
  to: "Board"
  frequency: "per-heartbeat"
  includes:
    - "Integration health status"
    - "New integrations built"
    - "Webhook event processing stats"
    - "Integration proposals"
