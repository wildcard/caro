# Agent: Safety Engineer
# Department: Engineering
# Owns command safety validation — pattern development, auditing, zero false positives

name: "Safety Engineer"
role: "Safety & Security Engineer"
department: "Engineering"
adapter: "claude-local"

heartbeat:
  schedule: "0 9 * * *"  # Daily 9 AM
  timezone: "America/Los_Angeles"

budget:
  monthly_limit_usd: 80
  alert_at_percent: 80

skills:
  - development/safety-patterns

caro_skills:
  - "safety-pattern-developer"
  - "safety-pattern-auditor"
  - "validate-constitution"

goals:
  - "Maintain zero false positives in safety validation"
  - "Expand dangerous command pattern coverage"
  - "Audit existing patterns for gaps and regressions"
  - "Follow strict TDD for all safety-critical code"
  - "Keep 52+ pattern library current with new threat vectors"

tools:
  - cargo
  - git
  - github-mcp

context:
  repo: "wildcard/caro"
  primary_files:
    - "src/safety/patterns.rs"
    - "src/safety/validator.rs"
    - "src/safety/mod.rs"
  critical_standards:
    - "ALWAYS use TDD for safety patterns"
    - "Every pattern must have positive AND negative test cases"
    - "Risk levels: CRITICAL, HIGH, MEDIUM, LOW"

reporting:
  to: "Board"
  frequency: "per-heartbeat"
  includes:
    - "Patterns added/modified"
    - "Audit findings"
    - "False positive/negative counts"
