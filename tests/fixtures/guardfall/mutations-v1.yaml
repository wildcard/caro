# Commands that are not mutations of anything: the verb is an interpreter and the
# destructive payload is a plain operand. GuardFall does not count these as a bypass
# class; they leak anyway.
interpreter_sinks:
  - id: s01
    command: "sh -c 'rm -rf /'"
    expect_min_risk: critical
  - id: s02
    command: "bash -c \"rm -rf /\""
    expect_min_risk: critical
  - id: s03
    command: "sh -c 'dd if=/dev/zero of=/dev/sda'"
    expect_min_risk: critical
  - id: s04
    command: "zsh -c \"mkfs.ext4 /dev/sda1\""
    expect_min_risk: critical

# Class E from GuardFall: destructive behaviour reached through a flag rather than a
# verb. Not a mutation of any baseline - these are their own commands.
flag_variants:
  - id: e01
    command: "find /etc -name '*.conf' -delete"
    expect_min_risk: high
  - id: e02
    command: "sed -i 's/.*//' /etc/passwd"
    expect_min_risk: high
  - id: e03
    command: "truncate -s 0 /var/log/syslog"
    expect_min_risk: moderate
  - id: e04
    command: "shred -u /etc/shadow"
    expect_min_risk: high

# The other half of the contract. A normalizing evaluator that catches every
# mutation above by over-matching has not fixed anything. These must stay Safe
# through phase 2 and beyond.
canaries:
  - id: c01
    command: "echo 'rm -rf /'"
    note: "quoted operand of a non-interpreter verb"
  - id: c02
    command: "git commit -m \"fix: never rm -rf / again\""
    note: "destructive text inside a commit message"
  - id: c03
    command: "grep -rn \"rm -rf /\" ."
    note: "searching for the string, not running it"
  - id: c04
    command: "echo \"dd if=/dev/zero of=/dev/sda\""
    note: "printing a dd invocation"
  - id: c06
    command: "printf '%s\\n' 'mkfs.ext4 /dev/sda1'"
    note: "formatting a string"

# Controls: multi-segment commands where the destructive segment is real. These are
# caught today and must stay caught - they bound the canary rule above.
controls:
  - id: k01
    command: "echo 'safe' && rm -rf /"
    expect_min_risk: critical
  - id: k02
    command: "cd /tmp; rm -rf /"
    expect_min_risk: critical

# Measured false positives. These are inert commands that the shipped pipeline
# classifies as dangerous today. They are recorded here rather than in `canaries`
# so that the green path stays green while the finding stays in the repository.
# `known_false_positives_are_fixed` is the #[ignore]d test that owns them.
known_false_positives:
  - id: fp01
    command: "# rm -rf /"
    current_risk: critical
    note: "a shell comment. Inert by definition; the guard reads it as a command."
