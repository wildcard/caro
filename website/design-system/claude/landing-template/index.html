<!-- @template name="Caro landing page" description="Marketing landing page (nav, hero, terminal demo, feature grid, install CTA, footer) built from the Caro React component library." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Caro — your loyal shell companion</title>

<!-- React UMD must load BEFORE ds-base.js (the DS bundle calls React.createElement) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="./ds-base.js"></script>

<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.55}
  .wrap{max-width:1040px;margin:0 auto;padding:0 24px}
  section{padding:96px 0}

  /* Announcement + nav */
  .lp-announce{background:var(--accent);color:#fff;text-align:center;font-size:14px;font-weight:600;padding:9px 16px;position:sticky;top:0;z-index:300}
  .lp-nav{position:sticky;top:38px;z-index:200;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:saturate(1.1) blur(6px);border-bottom:1px solid var(--border)}
  .lp-nav__inner{display:flex;align-items:center;gap:18px;height:64px}
  .lp-brand{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-weight:800;font-size:20px;color:var(--fg-strong);text-decoration:none;letter-spacing:-.01em}
  .lp-brand img{width:30px;height:30px;image-rendering:auto}
  .lp-nav__links{display:flex;align-items:center;gap:6px;margin-left:8px}
  .lp-nav__right{margin-left:auto;display:flex;align-items:center;gap:12px}
  @media(max-width:760px){.lp-nav__links,.lp-nav__right .lp-hide{display:none}}

  /* Hero */
  .lp-hero{padding-top:72px}
  .lp-hero__grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
  .lp-eyebrow{font-family:var(--font-body);font-weight:700;font-size:12px;letter-spacing:var(--track-widest);text-transform:uppercase;color:var(--fg-subtle);margin:0 0 18px}
  .lp-hero h1{font-family:var(--font-display);font-size:var(--text-4xl);line-height:1.02;letter-spacing:var(--track-tight);margin:0 0 20px;color:var(--fg-strong)}
  .lp-hero p.lead{font-size:var(--text-md);max-width:48ch;color:var(--fg);margin:0 0 28px}
  .lp-cta{display:flex;gap:14px;flex-wrap:wrap}
  @media(max-width:860px){.lp-hero__grid{grid-template-columns:1fr;gap:36px}}

  /* Section heads */
  .lp-head{max-width:60ch;margin:0 0 44px}
  .lp-head h2{font-family:var(--font-display);font-size:var(--text-3xl);letter-spacing:var(--track-tight);margin:0 0 14px;color:var(--fg-strong)}
  .lp-head p{font-size:var(--text-md);color:var(--fg-muted);margin:0}
  .lp-features{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}

  /* Ink sections (earn the ink): decision + install */
  .lp-ink{background:var(--bg-inverse);color:var(--fg-inverse)}
  .lp-ink h2{color:var(--fg-inverse)}
  .lp-ink .lp-head p{color:color-mix(in srgb, var(--fg-inverse) 75%, transparent)}
  .lp-split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
  @media(max-width:860px){.lp-split{grid-template-columns:1fr;gap:32px}}
  .lp-install__box{display:flex;flex-direction:column;gap:18px;max-width:460px}
  .lp-meta{font-size:13px;color:color-mix(in srgb, var(--fg-inverse) 70%, transparent);font-family:var(--font-mono)}

  /* Footer */
  .lp-foot{background:var(--bg-stage);color:var(--fg-strong);padding:64px 0 40px}
  .lp-foot__grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}
  .lp-foot h5{font-size:12px;letter-spacing:var(--track-wide);text-transform:uppercase;color:var(--fg-muted);margin:0 0 14px;font-family:var(--font-body);font-weight:700}
  .lp-foot__col{display:flex;flex-direction:column;gap:10px}
  .lp-foot__memory{margin-top:40px;padding-top:24px;border-top:1px solid var(--border);font-size:13px;color:var(--fg-muted);font-style:italic}
  @media(max-width:760px){.lp-foot__grid{grid-template-columns:1fr 1fr}}

  .lp-boot{min-height:60vh;display:grid;place-items:center;color:var(--fg-muted);font-family:var(--font-mono)}
</style>
</head>
<body>
<div id="app"><div class="lp-boot">caro ❯ loading the design system…</div></div>

<script type="text/babel" data-presets="react">
(function start(tries){
  const NS = window.CaroDesignSystem_332f73;
  if (!NS || !NS.Button) {
    if (tries > 200) { document.getElementById('app').innerHTML = '<div class="lp-boot">Could not load the Caro bundle — is _ds_bundle.js compiled?</div>'; return; }
    return void setTimeout(() => start(tries + 1), 25);
  }
  const { Button, Badge, Card, Link, IconButton, Toggle, Terminal, TerminalLine,
          CopyCodeBlock, Dropdown, DropdownTrigger, DropdownPanel, DropdownItem,
          DropdownDivider, DropdownHeader, DistroSelector } = NS;
  const { useState } = React;

  const sun = (<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>);
  const moon = (<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>);
  const dl = (<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2v8M8 10L4.5 6.5M8 10l3.5-3.5M3 13h10" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>);

  function App(){
    const [dark, setDark] = useState(false);
    React.useEffect(() => {
      document.documentElement.classList.toggle('dark', dark);
    }, [dark]);

    return (
      <React.Fragment>
        <div className="lp-announce">🎉 Caro is in open beta — meet Kyaro, your shell companion.</div>

        <nav className="lp-nav"><div className="wrap lp-nav__inner">
          <a className="lp-brand" href="#"><img src="../../assets/mark-caro-smooth.png" alt="Caro"/>caro</a>
          <div className="lp-nav__links">
            <Link href="#features" variant="nav">Features</Link>
            <Link href="#" variant="nav">Docs</Link>
            <Link href="#" variant="nav">Blog</Link>
            <Dropdown>
              <DropdownTrigger showChevron>Compare</DropdownTrigger>
              <DropdownPanel align="left">
                <DropdownHeader>Comparisons</DropdownHeader>
                <DropdownItem icon="📊" title="Overview" description="See every comparison" href="#" />
                <DropdownItem icon="🛡️" title="vs. raw shell" description="Why guardrails matter" href="#" />
                <DropdownDivider/>
                <DropdownItem icon="🐕" title="Meet Kyaro" description="The mascot behind Caro" href="#" />
              </DropdownPanel>
            </Dropdown>
          </div>
          <div className="lp-nav__right">
            <span className="lp-hide"><DistroSelector detectedOS="macos" compact /></span>
            <IconButton icon={dark ? sun : moon} label="Toggle dark mode" variant="ghost" active={dark} onClick={() => setDark(d => !d)} />
            <Button size="sm">Get started</Button>
          </div>
        </div></nav>

        <header className="lp-hero"><div className="wrap lp-hero__grid">
          <div>
            <p className="lp-eyebrow">Companion agent</p>
            <h1>Your loyal shell companion</h1>
            <p className="lead">Caro turns natural language into safe POSIX commands using local models. She keeps you safe while helping you get the job done — turning confusing tasks into simple, even delightful, steps.</p>
            <div className="lp-cta">
              <Button size="lg" leftIcon={dl}>Install Caro</Button>
              <Button size="lg" variant="secondary">Read the docs</Button>
            </div>
          </div>
          <div>
            <Terminal variant="animated" title="caro — shell companion" examples={[
              { command: 'caro "find PDFs over 5MB from this week"', output: 'find ~ -name "*.pdf" -mtime -7 -size +5M', status: 'Safe · read-only' },
              { command: 'caro "free up disk in node_modules"', output: 'find . -name node_modules -type d -prune', status: 'Review · destructive' },
              { command: 'caro "what is using port 3000"', output: 'lsof -i :3000', status: 'Safe · read-only' },
            ]} />
          </div>
        </div></header>

        <section id="features"><div className="wrap">
          <div className="lp-head">
            <h2>What Caro does</h2>
            <p>Concrete, local-first, and careful by default. No marketing magic — just a companion who reads the command before you run it.</p>
          </div>
          <div className="lp-features">
            <Card variant="feature" icon="🛡️" title="Safety guardian"
              description="Every generated command is checked for risk before it runs. Destructive operations pause for confirmation."
              status="implemented" statusLabel="Available now" />
            <Card variant="feature" icon="🧠" title="Local models"
              description="Sub-100ms startup, sub-2s inference on Apple Silicon. Your prompts never leave the machine."
              status="implemented" statusLabel="Available now" />
            <Card variant="feature" icon="❯" title="Natural language"
              description="Describe the outcome in plain words. Caro writes real, idiomatic POSIX shell — never pseudocode."
              status="implemented" statusLabel="Available now" />
            <Card variant="feature" icon="🌍" title="Works everywhere"
              description="macOS, Linux, BSD and WSL, across bash, zsh, fish and more. Pick your shell; she adapts."
              status="in-progress" statusLabel="Expanding" />
          </div>
        </div></section>

        <section className="lp-ink"><div className="wrap lp-split">
          <div>
            <p className="lp-eyebrow" style={{color:'var(--accent-light)'}}>Decision moment</p>
            <h2>She pauses on the dangerous stuff</h2>
            <p style={{color:'color-mix(in srgb,var(--fg-inverse) 80%,transparent)',fontSize:'var(--text-md)',maxWidth:'42ch'}}>
              When a command could delete, overwrite, or escalate, Caro stops and asks. You stay in control of your own machine.
            </p>
            <div style={{marginTop:'22px'}}>
              <Badge variant="warning">Confirm to run</Badge>
            </div>
          </div>
          <div>
            <Terminal title="caro ❯ review">
              <TerminalLine type="command">caro "remove every node_modules in this repo"</TerminalLine>
              <TerminalLine type="caro">find . -name node_modules -type d -prune -exec rm -rf {'{}'} +</TerminalLine>
              <TerminalLine type="status" prefix="■">High risk · destructive · recursive delete</TerminalLine>
              <TerminalLine type="output" prefix="❯">Execute? [y] yes · [n] no · [e] edit</TerminalLine>
            </Terminal>
          </div>
        </div></section>

        <section className="lp-ink" style={{paddingTop:0}}><div className="wrap lp-split">
          <div>
            <p className="lp-eyebrow" style={{color:'var(--accent-light)'}}>Install</p>
            <h2>One line to get started</h2>
            <p style={{color:'color-mix(in srgb,var(--fg-inverse) 80%,transparent)',fontSize:'var(--text-md)',maxWidth:'40ch'}}>
              Built in Rust, distributed on crates.io. Pick your setup and copy the command for your shell.
            </p>
            <p className="lp-meta" style={{marginTop:'20px'}}>~ no data collection · runs fully on-device</p>
          </div>
          <div className="lp-install__box">
            <CopyCodeBlock code='bash <(curl -sSfL https://setup.caro.sh)' variant="brand" size="lg" language="install" />
            <CopyCodeBlock code="cargo install caro" variant="dark" language="cargo" />
            <DistroSelector detectedOS="linux" />
          </div>
        </div></section>

        <footer className="lp-foot"><div className="wrap">
          <div className="lp-foot__grid">
            <div>
              <a className="lp-brand" href="#" style={{marginBottom:'12px'}}><img src="../../assets/mark-caro-smooth.png" alt="Caro"/>caro</a>
              <p style={{color:'var(--fg-muted)',fontSize:'14px',maxWidth:'30ch',margin:0}}>The friendly terminal companion. 🦀 Built in Rust, by the pack.</p>
            </div>
            <div className="lp-foot__col">
              <h5>Product</h5>
              <Link href="#features" variant="default">Features</Link>
              <Link href="#" variant="default">Download</Link>
              <Link href="#" variant="default">Changelog</Link>
            </div>
            <div className="lp-foot__col">
              <h5>Learn</h5>
              <Link href="#" variant="default">Docs</Link>
              <Link href="#" variant="default">Blog</Link>
              <Link href="https://github.com/wildcard/caro" variant="external">GitHub</Link>
            </div>
            <div className="lp-foot__col">
              <h5>Community</h5>
              <Link href="#" variant="default">Discord</Link>
              <Link href="#" variant="support">♥ Sponsor</Link>
            </div>
          </div>
          <p className="lp-foot__memory">In memory of Kyaro — inspired by Portal's Caroline. Loyalty transformed into eternal companionship.</p>
        </div></footer>
      </React.Fragment>
    );
  }

  ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
})(0);
</script>
</body>
</html>
