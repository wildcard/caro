<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Signal-red ring (flat — the design system forbids gradients).
       Kyaro himself is the caro-pixel.png below and is never recolored. -->
  <circle cx="50" cy="50" r="48" fill="#ef3333"/>
  <!-- Inner paper-beige circle for contrast -->
  <circle cx="50" cy="50" r="42" fill="#f4f1df"/>
  <!-- Caro pixel art placeholder -->
  <image href="/caro-pixel.png" x="25" y="25" width="50" height="50" style="image-rendering: pixelated;"/>
</svg>
