<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caro TUI Demo</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* main is the flex item now; give it the width #ratzilla used to get from body. */
        main {
            width: min(100%, 900px);
        }
        #ratzilla {
            width: 100%;
            max-width: 900px;
            height: 550px;
        }
    </style>
</head>
<body>
    <main>
        <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap">Caro terminal UI demo</h1>
        <div id="ratzilla"></div>
    </main>
</body>
</html>
